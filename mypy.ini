# Strict type checking, matching Home Assistant core's own mypy settings for
# integrations (the [mypy] section of core's generated mypy.ini, minus the
# options that only apply to core's own tree: plugins, stubs path, workers).
# This is what the quality scale's strict-typing rule means for a core
# integration listed in core's .strict-typing file. When core changes these
# settings, copy the change here; see docs/quality-scale.md.
#
# Checked against the Home Assistant version requirements_test.txt pins.
# Run: mypy   (or bash scripts/run_tests.sh --full)

[mypy]
files = custom_components/dockhand
python_version = 3.14
platform = linux
show_error_codes = true
follow_imports = normal
local_partial_types = true
strict_equality = true
strict_bytes = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = deprecated, explicit-override, ignore-without-code, redundant-self, truthy-iterable
disable_error_code = annotation-unchecked, import-not-found, import-untyped
extra_checks = false
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true

[mypy-homeassistant.*]
no_implicit_reexport = true
