rules:
  # ── Bronze ────────────────────────────────────────────────────────────────

  action-setup:
    status: exempt
    comment: >
      No custom service actions are registered.

  appropriate-polling:
    status: done
    comment: >
      All three coordinators use DataUpdateCoordinator with fixed intervals
      (not user-configurable). Fast coordinator every 60 s (stats, containers, stacks,
      container and stack resource stats, pending-update flags); slow coordinator
      every 600 s (images, volumes, networks, schedules, git stacks,
      host info, container auto-update settings, runtime controls, and
      env_meta — the handful of fields only /api/environments has: image-prune
      enabled, Hawser agent identity, configured connection host/port);
      update coordinator (Tier 2 only, optional) every 24 h (registry update checks — deliberately infrequent to avoid
      unnecessary load on the Docker host). Dashboard stats are fetched in a
      single API call per fast poll cycle rather than one call per environment.
      Container resource stats are fetched via a single bulk API call per
      environment (GET /api/containers/stats?env=N) rather than one call per
      container, and stack totals the same way (GET /api/stack-stats?env=N,
      feature-detected — Dockhand 1.0.52+).

  brands:
    status: done
    comment: >
      brand/ directory is present with icon assets.

  common-modules:
    status: done
    comment: >
      The coordinators are in coordinator.py and the shared base entities in
      entity.py (environment-, container- and stack-scoped, each with its own
      device and data lookup); the platform modules subclass those. helpers.py
      holds the rest of what several modules share: URL builders, DeviceInfo
      factories, device registration, and the per-resource lookups used by
      entities on the slow coordinator.

  config-flow:
    status: done
    comment: >
      Full UI config flow: async_step_user (URL and SSL), async_step_token
      (shown only when the server returns 401), async_step_setup_options (feature
      flags, so everything is set up front),
      async_step_reauth_confirm, async_step_reconfigure (URL, SSL, token), and
      an options flow. Every field has a data_description. entry.data holds
      only the connection details; everything the options flow sets lives in
      entry.options (settings older releases stored in entry.data are moved
      by the schema migration). The token field uses a password TextSelector.

  config-flow-test-coverage:
    status: done
    comment: >
      Full test coverage across all flow steps in test_config_flow.py:
      async_step_user, async_step_token, async_step_setup_options,
      async_step_reauth_confirm, async_step_reconfigure, and the options
      flow. Covers all error branches, duplicate detection, auth-detection
      probe, token merging, origin-routing, no-auth token stripping,
      token-clear-disables-auth, new-token replacement, and options stored
      correctly at setup.

  dependency-transparency:
    status: done
    comment: >
      No third-party requirements. Uses only HA's bundled aiohttp session via
      async_get_clientsession.

  docs-actions:
    status: exempt
    comment: >
      No custom service actions registered.

  docs-conditions:
    status: exempt
    comment: >
      The integration registers no automation conditions.

  docs-high-level-description:
    status: done
    comment: >
      README opens with a description of the integration and the Dockhand
      project it connects to.

  docs-installation-instructions:
    status: done
    comment: >
      README has step-by-step Installation section covering HACS and manual
      methods, including prerequisites.

  docs-removal-instructions:
    status: done
    comment: >
      README has a Removal section describing how to delete via the HA UI and
      uninstall via HACS.

  docs-triggers:
    status: exempt
    comment: >
      The integration registers no automation triggers.

  entity-event-setup:
    status: exempt
    comment: >
      No event-subscribed entities. All entities are coordinator-polled.

  entity-unique-id:
    status: done
    comment: >
      Every entity class sets _attr_unique_id in its __init__ using a
      config-entry-scoped string: {entry_id}_{env_id}_{type}_{discriminator}.
      Scoping by entry_id ensures uniqueness across multiple Dockhand instances.

  has-entity-name:
    status: done
    comment: >
      All entity classes set _attr_has_entity_name = True. Static entity names
      are provided via _attr_translation_key (not _attr_name) so that HA uses
      the translated string from strings.json / translations/*.json. Dynamic
      names (image repo name, network name, volume name) use self._attr_name
      in __init__ since they are data-driven and cannot be expressed as
      translation keys.

  runtime-data:
    status: done
    comment: >
      DockhandData (client, the fast and slow coordinators, the update
      coordinator when precise update versions are on, and per-setup entity
      bookkeeping) is stored on entry.runtime_data. The DockhandConfigEntry
      alias is used for every entry argument, the options flow included, so
      runtime_data is typed without casting.

  test-before-configure:
    status: done
    comment: >
      async_step_user probes the server with GET /api/host (no env param)
      before saving — confirmed from Dockhand's source that this still runs
      through its shared auth check (unlike GET /health, which has none at
      all), and returns a small, fixed-size payload with no per-environment
      or secret data. If auth is required (401), async_step_token validates
      the provided token with another probe before saving. Raises
      appropriate errors for invalid token and connection failure with
      translated error keys.

  test-before-setup:
    status: done
    comment: >
      async_setup_entry raises ConfigEntryNotReady if the fast coordinator's
      first refresh fails, and ConfigEntryAuthFailed if the token is invalid or revoked.

  unique-config-entry:
    status: done
    comment: >
      async_set_unique_id called with the normalised API URL in async_step_user.
      _abort_if_unique_id_configured prevents duplicate config entries. This
      check runs before the server probe so duplicates are rejected early.

  # ── Silver ────────────────────────────────────────────────────────────────

  action-exceptions:
    status: done
    comment: >
      The integration registers no service actions of its own, but the rule
      also covers platform actions, and it has those: buttons (restart,
      redeploy, git deploy, check for updates, update all), switches
      (container and stack running, auto update, git auto deploy), numbers
      and the select (runtime controls), and update install. Every one raises
      HomeAssistantError with a translation key when the action fails
      (action_failed, carrying Dockhand's error) or its container or git
      stack is gone (container_not_found, git_stack_not_found).

  config-entry-unloading:
    status: done
    comment: >
      async_unload_entry calls async_unload_platforms and returns its result.
      All coordinator listeners are cleaned up via entry.async_on_unload.

  docs-configuration-parameters:
    status: done
    comment: >
      README "Configuration parameters" documents every setup field (API URL,
      SSL verification, API token) and every option (the
      schedules/images/volumes/networks switches, update entities, precise
      update versions, runtime controls, container and stack stats), plus what
      Reconfigure changes.

  docs-installation-parameters:
    status: done
    comment: >
      README Setup section documents all fields shown during installation:
      API URL and API token (shown only when server authentication is enabled).

  entity-unavailable:
    status: done
    comment: >
      All entities are CoordinatorEntity, so a failed poll makes that
      coordinator's entities unavailable. Where only part of a poll fails (one
      environment, or one optional fetch, recorded in fetch_failures), the
      entities depending on that part also report unavailable, and every
      `available` override starts from super().available. Entities whose
      container or stack has gone report unavailable until cleanup removes
      them.

  integration-owner:
    status: done
    comment: >
      manifest.json codeowners field set to ['@raetha'].

  log-when-unavailable:
    status: done
    comment: >
      DataUpdateCoordinator logs once when a fetch fails (UpdateFailed) and
      once when it recovers. Subsequent failures at the same level are
      suppressed to avoid log spam.

  parallel-updates:
    status: done
    comment: >
      PARALLEL_UPDATES = 0 in every platform. Reads all go through the
      coordinators. For the action platforms (button, switch, number, select,
      update), each action is one request to Dockhand, which queues Docker
      work itself and handles concurrent requests the same way its own UI
      sends them; container updates go through its batch-update job API.
      Serializing them in Home Assistant would only slow down a script that
      starts several containers, without protecting anything.

  reauthentication-flow:
    status: done
    comment: >
      async_step_reauth and async_step_reauth_confirm implemented. On a 401,
      the fast coordinator raises ConfigEntryAuthFailed immediately so HA
      surfaces the re-authentication prompt. The reauth flow accepts a new
      API token and reloads the entry.

  test-coverage:
    status: done
    comment: >
      Pytest suite (pytest-homeassistant-custom-component) covering the API
      client, config and options flows, coordinators, every platform and
      entity class, device registration and cleanup, manual device removal,
      registry and config-entry migrations (including downgrades), system
      container protection, repair issues, diagnostics redaction, and
      setup/unload. Every line is covered, and scripts/run_tests.sh --full
      and CI both fail if one isn't (pytest --cov-fail-under=100).

  # ── Gold ──────────────────────────────────────────────────────────────────

  devices:
    status: done
    comment: >
      All device registration is centralised in helpers.py via two functions:
      _ensure_env_devices (env hub, Containers/Stacks/Networks/Images/Volumes
      group devices, and individual stack devices) and _ensure_hub_devices
      (Schedules hub and per-schedule devices). Both functions are called from
      _register_devices at startup and from coordinator listeners on live
      updates, ensuring device attributes are always consistent. Device
      hierarchy: Environment hub → Containers/Stacks/Networks/Images/Volumes
      group → individual container/stack devices (env-prefixed names).
      Images, networks, and volumes are entities directly under their group
      device — no per-resource sub-devices. Schedules hub is a top-level
      device with one per-schedule child device.

  diagnostics:
    status: done
    comment: >
      diagnostics.py implements async_get_config_entry_diagnostics. Returns
      redacted config entry data, per-environment summary counts, full fast
      and slow coordinator snapshots, and an update-check summary (system
      container results and Dockhand's own release check). api_token is redacted from config data;
      labels, tlsKey, and hawserToken are redacted from coordinator snapshots
      (labels routinely carry secrets such as reverse-proxy auth hashes;
      tlsKey/hawserToken are defense-in-depth for env_meta, which only ever
      extracts specific named fields from /api/environments and never stores
      its raw response — this redaction covers the case where either secret
      ends up in coordinator state some other way).

  discovery:
    status: exempt
    comment: >
      Dockhand has no mDNS, SSDP, DHCP, or Bluetooth discovery mechanism.

  discovery-update-info:
    status: exempt
    comment: >
      No discovery mechanism; not applicable.

  docs-data-update:
    status: done
    comment: >
      README "Data Updates" explains the three coordinators (what each fetches,
      and their fixed intervals), how to refresh on your own schedule with
      polling off and homeassistant.update_entity, what becomes unavailable
      when all or part of a poll fails, and how token errors surface as
      re-authentication.

  docs-examples:
    status: done
    comment: >
      README "Example automations" has several ready-to-adapt YAML examples:
      notify when a container stops, restart a container that stays unhealthy,
      and notify when a Docker host goes offline.

  docs-known-limitations:
    status: done
    comment: >
      README "Known limitations" lists what the integration can't do and why:
      polling only, read-only schedules, restart needing a running container,
      runtime controls only for stand-alone containers, no controls for system
      containers, Install not moving to a newer version tag, no updates for
      digest-pinned images, git stack deploy
      following the stack's own repull setting, stats only for running
      containers, and hidden containers. "Requirements" covers which features
      need which Dockhand version.

  docs-supported-devices:
    status: done
    comment: >
      README describes Dockhand (with a link) as the supported service, and
      "Requirements" gives the Home Assistant and Dockhand versions needed,
      including which features need a newer Dockhand.

  docs-supported-functions:
    status: done
    comment: >
      README includes a comprehensive entity reference table covering all
      platforms and entity categories, with notes on which are disabled by
      default.

  docs-troubleshooting:
    status: done
    comment: >
      README "Troubleshooting" covers connection errors, entity IDs with a
      suffix after an update, no entities after setup, leftover devices and
      how to delete them, and why schedules have no run button. Authentication
      problems are covered under "Re-authentication".

  docs-use-cases:
    status: done
    comment: >
      README "Use cases" describes what people use the integration for:
      outage alerts, automatic recovery, update management, resource history,
      and dashboards (with the companion card library).

  dynamic-devices:
    status: done
    comment: >
      _register_devices() runs at startup and delegates to _ensure_env_devices
      and _ensure_hub_devices (both in helpers.py) to idempotently
      pre-register all devices from initial coordinator data. All platform
      modules register coordinator listeners that call async_add_entities for
      newly discovered resources (containers, stacks, images, networks, volumes,
      schedules, update entities). The Containers group device is only created
      when at least one freestanding (non-Compose) container exists, and is
      removed when an online environment transitions to all-Compose. Stale
      devices and entities are cleaned up by _cleanup_stale_registry(), which
      runs on all three coordinator listeners and once at startup. Listeners
      are cleaned up on unload via entry.async_on_unload.

  entity-category:
    status: done
    comment: >
      EntityCategory.DIAGNOSTIC applied to all monitoring and config-mirror
      entities, including the container and stack resource stats sensors (CPU
      usage, memory usage, memory usage %, memory limit, network in/out, disk
      read/write).
      EntityCategory.CONFIG applied to Restart buttons (user-initiated device
      control actions). Primary state sensors (Container State, Stack Status) and
      Running switches have no category as they are primary control and observation
      entities.

  entity-device-class:
    status: done
    comment: >
      SensorDeviceClass.DATA_SIZE used for the disk usage sensor and the
      container and stack resource stats sensors (memory usage,
      memory limit, network in/out, disk read/write). SensorDeviceClass.TIMESTAMP
      used for the schedule next-run sensor. BinarySensorDeviceClass.CONNECTIVITY
      used for the environment Online sensor. All other sensors and binary sensors
      use SensorStateClass.MEASUREMENT or no device class where no standard class
      fits (e.g. container state as a string sensor).

  entity-disabled-by-default:
    status: done
    comment: >
      Niche or verbose entities are disabled by default via
      _attr_entity_registry_enabled_default = False: disk usage,
      activity events, Hawser agent version (and its
      agent_name/agent_id/last_seen attributes, edge-mode only), the
      config-mirror binary sensors (activity collection, metrics collection,
      vulnerability scanning, update checks, auto update, image pruning),
      the host info sensors (platform, Docker version, last
      boot — all share one base class's flag), the container auto-update
      switch, and the git stack auto-deploy switch. The
      container Health sensor is enabled by default — it is only ever
      created when the container has a Docker healthcheck configured, so
      it is never permanently unavailable. The container Image sensor was
      removed in 1.6.0 (image name is an attribute on the State sensor).
      Note: the container resource stats sensors (CPU usage, memory usage,
      memory usage %, memory limit, network in, network out, disk read,
      disk write) are a stronger case than "disabled by default" — they
      are not created at all unless "Enable container and stack stats" is on, same
      pattern as enable_images/enable_volumes/enable_networks, so turning
      the option off removes them via the existing cleanup system rather
      than just leaving them disabled in the registry.

  entity-translations:
    status: done
    comment: >
      All statically-named entities use _attr_translation_key referencing entries
      in strings.json and translations/*.json. Dynamic-name entities (image repo,
      network name, volume name) use self._attr_name in __init__ since their
      names are data-driven. Translation keys are defined for English plus
      all machine-translated locales in translations/.

  exception-translations:
    status: done
    comment: >
      All entity action methods (async_press in button.py, async_turn_on /
      async_turn_off in switch.py, async_install in update.py) catch API
      errors and re-raise as HomeAssistantError with translation_domain=
      "dockhand" and a translation_key referencing entries in strings.json.
      The defined exception keys are action_failed (wraps the API error
      message via a {error} placeholder), container_not_found (raised
      when the coordinator no longer has the container at action time), and
      git_stack_not_found (the same case for git stack sync/deploy actions).
      Config flow errors use translated error keys (cannot_connect,
      invalid_auth) via strings.json.

  icon-translations:
    status: done
    comment: >
      icons.json provides MDI icons for all sensor, binary_sensor, button,
      switch, number, and select entities via _attr_translation_key. Includes
      state-specific icons for container State (running/stopped/paused), Health
      (healthy/unhealthy/starting), and Stack Status (running/partial/stopped).
      The update platform intentionally has no icon entry — HA's frontend always
      displays the integration icon for update entities regardless of icons.json,
      matching standard HA behavior. Per the quality scale docs, icons should not
      override the platform default when context is identical.

  reconfiguration-flow:
    status: done
    comment: >
      async_step_reconfigure implemented. Allows changing API URL, SSL setting,
      and API token without removing the integration. Feature flags are managed
      separately via the Options flow (Configure button).

  repair-issues:
    status: done
    comment: >
      Repair issues (all non-fixable, informational, and removed again when
      the condition clears): fetch_failed_top_level and fetch_failed_env when
      part of a poll keeps failing (naming the resources affected, so users
      see why some entities are unavailable); runtime_update_warning when
      Dockhand returns warnings for a live resource-limit change; and
      runtime_memory_reverted when lowering a memory limit stopped the
      container and the integration put the previous limit back.

  stale-devices:
    status: done
    comment: >
      _cleanup_stale_registry removes devices and entities Dockhand no longer
      reports, on every coordinator update and once at startup. Container and
      stack devices are keyed by name, so recreation doesn't orphan them.
      Anything it can't confirm is gone is kept: an offline environment's
      devices, or those of a fetch that failed this cycle. For those,
      async_remove_config_entry_device lets the user delete the device by
      hand, and refuses for a device Dockhand still reports (it would only be
      recreated) or a live environment and its group devices.

  # ── Platinum ──────────────────────────────────────────────────────────────

  async-dependency:
    status: done
    comment: >
      No third-party library: the integration's own API client (api.py) is
      fully async on Home Assistant's aiohttp session, with no blocking I/O,
      and each coordinator fetches its environments concurrently.

  inject-websession:
    status: done
    comment: >
      async_get_clientsession(hass, verify_ssl=...) is called in async_setup_entry
      and config_flow steps. The verify_ssl flag mirrors the CONF_VERIFY_SSL
      config entry option, defaulting to True. No session is created internally
      by the integration.

  strict-typing:
    status: done
    comment: >
      mypy.ini carries Home Assistant core's own strict settings (those of
      core's generated mypy.ini, which apply to integrations listed in its
      .strict-typing file), including explicit @override and the deprecation
      check. mypy passes on the pinned Home Assistant, and runs in CI and in
      scripts/run_tests.sh --full. py.typed is present. There's no
      third-party library to type: the API client is part of the integration.
      DockhandConfigEntry is used for every entry argument.
