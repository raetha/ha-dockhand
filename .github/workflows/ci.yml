name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Validate manifest, strings, and integration structure ──────────────
  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: "home-assistant/actions/hassfest@master"

  # ── HACS custom integration validation ─────────────────────────────────
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  # ── Lint with ruff ──────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check custom_components/dockhand/
      - name: Run ruff format check
        run: ruff format --check custom_components/dockhand/
        # tests/ excluded from format check — see [format] exclude in .ruff.toml

  # ── Full test suite via pytest-homeassistant-custom-component ───────────
  # PHCC pins an exact HA release and provides the same test infrastructure
  # used by HA core. See requirements_test.txt for the pinned version and
  # docs/development.md for local setup instructions.
  tests:
    name: Tests (pytest + PHCC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run test suite
        run: pytest tests/ -v --tb=short
