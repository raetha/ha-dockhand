name: Bug Report
description: Report a bug or unexpected behaviour with the Dockhand integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.3.0
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: e.g. 1.2.0
    validations:
      required: true

  - type: input
    id: dockhand_version
    attributes:
      label: Dockhand version
      placeholder: e.g. 1.0.27
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant HA log lines here (Settings → System → Logs, filter by "dockhand").
      render: text
