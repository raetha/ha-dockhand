[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Treat all asyncio tests as auto-mode so @pytest.mark.asyncio is optional
# on any test in a class marked @pytest.mark.asyncio or in a file with
# asyncio_mode = auto.

# Filter noisy HA deprecation warnings from test output
filterwarnings =
    ignore::DeprecationWarning:homeassistant.*
    ignore::DeprecationWarning:pytest_homeassistant_custom_component.*
